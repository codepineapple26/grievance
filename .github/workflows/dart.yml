name: Build Android ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: citizen-grievance-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
